version: "3.8"
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/mikeslist.db
    volumes:
      - mikeslist-data:/data
    command: sh -c "npx prisma migrate deploy && npm run start"
    restart: unless-stopped

volumes:
  mikeslist-data:
