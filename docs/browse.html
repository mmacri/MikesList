<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browse - Mike's List</title>
    <meta name="description" content="Browse Mike's List listings with filters." />
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-title"><a href="index.html">Mike's List</a></div>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="browse.html">Browse</a>
        <a href="post.html">Post</a>
        <a href="rules.html">Rules</a>
      </nav>
    </header>
    <main>
      <section>
        <h1>Browse listings</h1>
        <p class="small">Filter by category, location, tags, or keywords. Results update instantly.</p>
      </section>

      <div class="directory-layout">
        <aside class="filters-panel">
          <form id="filters-form">
            <div class="form-row">
              <label for="category-filter">Category</label>
              <select id="category-filter" name="category">
                <option value="">Any category</option>
                <option value="accounting-tax">Accounting &amp; Tax</option>
                <option value="legal">Legal</option>
                <option value="compliance-risk">Compliance &amp; Risk</option>
                <option value="it-security">IT &amp; Security</option>
                <option value="real-estate-services">Real Estate Services</option>
                <option value="health-wellness">Health &amp; Wellness</option>
                <option value="coaching-career">Coaching &amp; Career</option>
              </select>
            </div>

            <div class="form-row">
              <label for="location-filter">Location</label>
              <select id="location-filter" name="location">
                <option value="">Any location</option>
                <option value="remote">Remote/Online</option>
                <option value="san-diego-ca">San Diego, CA</option>
                <option value="austin-tx">Austin, TX</option>
                <option value="chicago-il">Chicago, IL</option>
                <option value="new-york-ny">New York, NY</option>
              </select>
            </div>

            <div class="form-row">
              <label for="search-filter">Search</label>
              <input id="search-filter" name="q" type="search" placeholder="Try: contract, coaching, SOC 2" />
            </div>

            <fieldset class="form-row">
              <legend>Tags</legend>
              <label class="tag-option"><input type="checkbox" name="tag" value="Remote available" />Remote available</label>
              <label class="tag-option"><input type="checkbox" name="tag" value="In-person" />In-person</label>
              <label class="tag-option"><input type="checkbox" name="tag" value="Urgent" />Urgent</label>
              <label class="tag-option"><input type="checkbox" name="tag" value="Ongoing" />Ongoing</label>
              <label class="tag-option"><input type="checkbox" name="tag" value="One-time" />One-time</label>
              <label class="tag-option"><input type="checkbox" name="tag" value="Free consult" />Free consult</label>
              <label class="tag-option"><input type="checkbox" name="tag" value="Fixed price" />Fixed price</label>
              <label class="tag-option"><input type="checkbox" name="tag" value="Hourly" />Hourly</label>
            </fieldset>
          </form>
        </aside>

        <section class="results-panel">
          <div class="results-header">
            <h2>Results</h2>
            <span id="results-count" class="small"></span>
          </div>
          <div id="results"></div>
        </section>
      </div>
    </main>
    <footer class="site-footer">
      <p class="small">Listings here are examples. Use the hosted app to post or reply.</p>
    </footer>
    <script src="assets/app.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        window.MikesList.initDirectoryPage({
          categorySelectId: "category-filter",
          locationSelectId: "location-filter",
          searchInputId: "search-filter",
          tagSelector: 'input[name="tag"]',
          resultsContainerId: "results",
          countId: "results-count",
          syncUrl: true
        });
      });
    </script>
  </body>
</html>
